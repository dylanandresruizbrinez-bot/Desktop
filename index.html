<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Windows 10</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="desktop">

  <!-- ICONOS -->
  <div class="icon" onclick="openApp('explorer')">
    📁 Archivos
  </div>

  <div class="icon" onclick="createWindow('notepad')">
    📝 Bloc
  </div>

  <!-- VENTANAS -->
  <div id="windows"></div>

</div>

<!-- TASKBAR -->
<div id="taskbar">
  <button onclick="toggleStart()">Inicio</button>
</div>

<!-- START MENU -->
<div id="startMenu" class="hidden">
  <div onclick="createWindow('notepad')">📝 Bloc de notas</div>
  <div onclick="openApp('explorer')">📁 Explorador</div>
</div>

<script src="script.js"></script>
</body>
</html>

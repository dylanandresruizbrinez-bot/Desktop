<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>WebOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="bootText">Iniciando sistema...</div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="loginBox">
    <h2>WebOS</h2>
    <input id="user" placeholder="usuario">
    <input id="pass" type="password" placeholder="contraseña">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div id="icons"></div>
  <div id="windows"></div>

  <div id="taskbar">
    <div onclick="toggleStart()">Inicio</div>
    <div id="taskApps"></div>
  </div>

  <div id="startMenu" class="hidden"></div>

</div>

<script src="kernel.js"></script>
<script src="ui.js"></script>

</body>
</html>

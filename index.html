<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mini Windows</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="desktop">
  
  <div class="window" id="win1">
    <div class="titlebar">
      <span>Mi ventana</span>
      <button onclick="closeWindow('win1')">X</button>
    </div>
    <div class="content">
      Hola, esto es una ventana.
    </div>
  </div>

</div>

<div id="taskbar">
  <button onclick="openWindow('win1')">Ventana 1</button>
</div>

<script src="script.js"></script>
</body>
</html>

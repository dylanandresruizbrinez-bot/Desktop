<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WebOS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>WebOS</h2>
    <input id="userInput" placeholder="Usuario">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- DESKTOPS -->
<div id="os" class="hidden">

  <div id="desktop"></div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <button onclick="toggleStart()">Inicio</button>
    <div id="appsBar"></div>
    <button onclick="switchDesktop()">🖥</button>
  </div>

  <!-- START MENU -->
  <div id="startMenu" class="hidden">
    <div onclick="createWindow('notepad')">Bloc de notas</div>
    <div onclick="createWindow('explorer')">Explorador</div>
  </div>

</div>

<audio id="clickSound" src="click.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
